name: Build Armbian EAIO-3588J V2 DTB Patch (Chroot Method)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt update
          sudo apt install -y wget unzip xz-utils losetup mount parted qemu-user-static

      - name: Download official Firefly ITX 3588J Armbian image
        run: |
          IMG_URL="https://github.com/armbian/community/releases/download/26.11.0-trunk.1/Armbian_community_26.11.0-trunk.1_Firefly-itx-3588j_trixie_vendor_6.1.115_minimal.img.xz"
          wget -c -O base.img.xz "${IMG_URL}"
          xz -d base.img.xz

      - name: Mount Armbian image partitions
        run: |
          sudo losetup -f --show base.img > loopdev.txt
          LOOP=$(cat loopdev.txt)
          sudo partprobe "${LOOP}"

          # 创建挂载目录
          sudo mkdir -p /mnt/rootfs /mnt/boot

          # p1 = boot, p2 = rootfs (Armbian标准分区布局)
          sudo mount "${LOOP}p1" /mnt/boot
          sudo mount "${LOOP}p2" /mnt/rootfs

          # 准备chroot环境
          sudo cp /usr/bin/qemu-aarch64-static /mnt/rootfs/usr/bin/
          sudo mount --bind /dev /mnt/rootfs/dev
          sudo mount --bind /proc /mnt/rootfs/proc
          sudo mount --bind /sys /mnt/rootfs/sys
          sudo mount --bind /tmp /mnt/rootfs/tmp

      - name: Copy custom DTS into chroot
        run: |
          DTS_FILE=rk3588-eaio-3588j-v2.dts
          sudo cp ./${DTS_FILE} /mnt/rootfs/root/

      - name: Compile DTS inside Armbian chroot using native dtc
        run: |
          sudo chroot /mnt/rootfs /bin/bash <<'EOF'
          cd /root
          DTS_NAME=rk3588-eaio-3588j-v2
          # 使用内核配套dtc，优先内核源码内dtc，fallback系统dtc
          if [ -d /usr/src/linux-headers-*/scripts/dtc ]; then
            DTC=$(find /usr/src/linux-headers-*/scripts/dtc -name dtc | head -n1)
          else
            DTC=dtc
          fi
          echo "Using dtc binary: $DTC"
          $DTC -I dts -O dtb -o ${DTS_NAME}.dtb ${DTS_NAME}.dts
          ls -l ${DTS_NAME}.dtb
          EOF

      - name: Extract compiled DTB out of chroot
        run: |
          DTB_NAME=rk3588-eaio-3588j-v2.dtb
          sudo cp /mnt/rootfs/root/${DTB_NAME} ./

      - name: Replace DTB on BOOT partition (two options choose one)
        run: |
          DTB_NEW=rk3588-eaio-3588j-v2.dtb
          DTB_ORIG=rk3588-firefly-itx-3588j.dtb

          # 方案A：直接覆盖原版dtb（推荐最简单，无需修改armbianEnv.txt）
          sudo cp ./${DTB_NEW} /mnt/boot/dtb/${DTB_ORIG}

          # 方案B：保留两份dtb，修改启动加载参数，取消注释启用
          #sudo cp ./${DTB_NEW} /mnt/boot/dtb/
          #sudo sed -i 's|^fdtfile=.*|fdtfile='"${DTB_NEW}"'|' /mnt/boot/extlinux/armbianEnv.txt

      - name: Cleanup chroot & unmount
        run: |
          sudo umount -l /mnt/rootfs/tmp
          sudo umount -l /mnt/rootfs/sys
          sudo umount -l /mnt/rootfs/proc
          sudo umount -l /mnt/rootfs/dev
          sudo umount -l /mnt/rootfs
          sudo umount -l /mnt/boot
          LOOP=$(cat loopdev.txt)
          sudo losetup -d "${LOOP}"

      - name: Repack final image
        run: |
          mv base.img Armbian_EAIO-3588J-V2.img
          xz Armbian_EAIO-3588J-V2.img

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EAIO-3588J-V2-Armbian-Image
          path: Armbian_EAIO-3588J-V2.img.xz
