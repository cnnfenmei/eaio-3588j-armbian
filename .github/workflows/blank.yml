name: Build Armbian RK3588 DTS

on:
  workflow_dispatch:

jobs:
  build-dts:
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # 1. Checkout 当前仓库
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. 安装编译依赖
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            make \
            gcc \
            g++ \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            rsync \
            wget \
            curl \
            xz-utils

      # ============================================================
      # 3. Clone Armbian Build
      # ============================================================
      - name: Clone Armbian Build
        run: |
          git clone --depth=1 \
            https://github.com/armbian/build.git \
            armbian-build

      # ============================================================
      # 4. 准备 Armbian 编译环境
      # ============================================================
      - name: Prepare Armbian
        run: |
          cd armbian-build

          mkdir -p userpatches

          cat > userpatches/config-example.conf <<'EOF'
          EOF

      # ============================================================
      # 5. 下载 RK3588 Kernel
      # ============================================================
      - name: Prepare Kernel Source
        shell: bash
        run: |
          set -e

          cd armbian-build

          ./compile.sh \
            BOARD=eaio-3588j \
            BRANCH=current \
            RELEASE=bookworm \
            BUILD_ONLY=yes \
            KERNEL_ONLY=yes \
            NO_APT_CACHER=yes \
            CLEAN_LEVEL=make,debs

      # ============================================================
      # 6. 查找 Kernel Source
      # ============================================================
      - name: Find Kernel Source
        shell: bash
        run: |
          echo "===== Kernel source directories ====="

          find cache/sources/linux-kernel-worktree \
            -maxdepth 2 \
            -type d \
            -print

      # ============================================================
      # 7. 编译 DTS
      # ============================================================
      - name: Compile RK3588 DTS
        shell: bash
        run: |
          set -e

          KERNEL_DIR=$(find \
            armbian-build/cache/sources/linux-kernel-worktree \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | head -n 1)

          echo "Kernel directory:"
          echo "$KERNEL_DIR"

          if [ ! -d "$KERNEL_DIR" ]; then
            echo "ERROR: Kernel source not found"
            exit 1
          fi

          cd "$KERNEL_DIR"

          echo "========================================"
          echo "Kernel root:"
          pwd
          echo "========================================"

          echo "Kernel Makefile:"
          ls -l Makefile

          echo "========================================"
          echo "Compile DTS"
          echo "========================================"

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            dtbs

      # ============================================================
      # 8. 查找生成的 DTB
      # ============================================================
      - name: Find DTB
        shell: bash
        run: |
          echo "===== Generated DTBs ====="

          find armbian-build/cache/sources/linux-kernel-worktree \
            -type f \
            -name "*.dtb" \
            -print

      # ============================================================
      # 9. 上传 DTB
      # ============================================================
      - name: Upload DTB
        uses: actions/upload-artifact@v4
        with:
          name: rk3588-dtb
          path: |
            armbian-build/cache/sources/linux-kernel-worktree/**/*.dtb
          if-no-files-found: error
