name: Build RK3588 EAIO DTS

on:
  workflow_dispatch:

jobs:
  build-dts:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. Install dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            make \
            gcc \
            g++ \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            rsync \
            wget \
            curl \
            xz-utils


      # ============================================================
      # 3. Clone Armbian
      # ============================================================
      - name: Clone Armbian
        run: |
          git clone --depth=1 \
            https://github.com/armbian/build.git \
            armbian-build


      # ============================================================
      # 4. Download / prepare RK3588 Kernel
      # ============================================================
      - name: Prepare RK3588 Kernel
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
          TERM: dumb
        run: |
          set -e

          cd armbian-build

          ./compile.sh \
            BOARD=recomputer-rk3588-devkit \
            BRANCH=current \
            RELEASE=bookworm \
            BUILD_ONLY=yes \
            KERNEL_ONLY=yes \
            KERNEL_CONFIGURE=no \
            NO_APT_CACHER=yes \
            CLEAN_LEVEL=""

      # ============================================================
      # 5. Locate Kernel
      # ============================================================
      - name: Locate Kernel source
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Searching Kernel source"
          echo "=========================================="

          find \
            armbian-build/cache/sources/linux-kernel-worktree \
            -maxdepth 2 \
            -type f \
            -name Makefile \
            -print


      # ============================================================
      # 6. Install EAIO DTS
      # ============================================================
      - name: Install EAIO DTS
        shell: bash
        run: |
          set -e

          KERNEL_DIR=$(find \
            armbian-build/cache/sources/linux-kernel-worktree \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | head -n 1)

          if [ -z "$KERNEL_DIR" ]; then
            echo "ERROR: Kernel source not found"
            exit 1
          fi

          echo "=========================================="
          echo "Kernel directory"
          echo "=========================================="

          echo "$KERNEL_DIR"

          DTS_DIR="$KERNEL_DIR/arch/arm64/boot/dts/rockchip"

          mkdir -p "$DTS_DIR"

          cp \
            "rk3588-eaio-3588j-v2(2).dts" \
            "$DTS_DIR/rk3588-eaio-3588j-v2.dts"

          echo "=========================================="
          echo "EAIO DTS installed"
          echo "=========================================="

          ls -lh \
            "$DTS_DIR/rk3588-eaio-3588j-v2.dts"


      # ============================================================
      # 7. Compile DTS
      # ============================================================
      - name: Compile EAIO DTS
        shell: bash
        run: |
          set -e

          KERNEL_DIR=$(find \
            armbian-build/cache/sources/linux-kernel-worktree \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | head -n 1)

          if [ -z "$KERNEL_DIR" ]; then
            echo "ERROR: Kernel source not found"
            exit 1
          fi

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo "Kernel directory"
          echo "=========================================="

          pwd

          echo "=========================================="
          echo "Compile EAIO DTS"
          echo "=========================================="

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            arch/arm64/boot/dts/rockchip/rk3588-eaio-3588j-v2.dtb


      # ============================================================
      # 8. Verify DTB
      # ============================================================
      - name: Verify DTB
        shell: bash
        run: |
          set -e

          KERNEL_DIR=$(find \
            armbian-build/cache/sources/linux-kernel-worktree \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | head -n 1)

          DTB="$KERNEL_DIR/arch/arm64/boot/dts/rockchip/rk3588-eaio-3588j-v2.dtb"

          echo "=========================================="
          echo "Generated DTB"
          echo "=========================================="

          if [ ! -f "$DTB" ]; then
            echo "ERROR: DTB not found"
            exit 1
          fi

          ls -lh "$DTB"

          file "$DTB"

          echo "=========================================="
          echo "SUCCESS"
          echo "=========================================="


      # ============================================================
      # 9. Upload DTB
      # ============================================================
      - name: Upload DTB
        uses: actions/upload-artifact@v4
        with:
          name: rk3588-eaio-3588j-v2-dtb
          path: |
            armbian-build/cache/sources/linux-kernel-worktree/*/arch/arm64/boot/dts/rockchip/rk3588-eaio-3588j-v2.dtb
          if-no-files-found: error
